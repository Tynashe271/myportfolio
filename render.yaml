services:
  - type: web
    name: myportfolio
    runtime: python
    repo: https://github.com/YOUR_USERNAME/myportfolio
    plan: free
    region: oregon
    buildCommand: "./build.sh"
    startCommand: "gunicorn myportfolio.wsgi:application"
    envVars:
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: myportfolio-db
          property: connectionString
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

databases:
  - name: myportfolio-db
    plan: free